<div class="container mt-4">
  <div class="mb-4">
    <h2>Editar Atividade</h2>
    <p class="text-muted">Atualize os dados da atividade física</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="editar()">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="mb-3">
          <label for="atividade" class="form-label">Nome da Atividade</label>
          <input
            type="text"
            id="atividade"
            class="form-control"
            formControlName="atividade"
            placeholder="Ex: Corrida, Musculação, Bike"
          />
        </div>

        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea
            id="descricao"
            class="form-control"
            rows="3"
            formControlName="descricao"
            placeholder="Descreva a atividade"
          ></textarea>
        </div>

        <div class="mb-3">
          <label for="intensidade" class="form-label">Intensidade</label>
          <select
            id="intensidade"
            class="form-select"
            formControlName="intensidade"
          >
            <option value="" disabled selected>Selecione</option>
            <option *ngFor="let intensidade of intensidades" [value]="intensidade">{{ intensidade }}</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="qtd_tempo" class="form-label">Tempo (em minutos)</label>
          <input
            type="number"
            id="qtd_tempo"
            class="form-control"
            formControlName="qtd_tempo"
            placeholder="Ex: 45"
          />
        </div>
        <div class="text-danger mt-1" *ngIf="formulario.get('qtd_tempo')?.invalid && formulario.get('qtd_tempo')?.touched">
          <small>Atividade precisa ter mais de 5 minutos</small>
        </div>
      </div>

      <div class="card-footer d-flex justify-content-end gap-2">
        <a routerLink="/" class="btn btn-secondary">
          Cancelar
        </a>

        <button (click)="editar() "type="button" class="btn btn-primary">
          Atualizar
        </button>
      </div>
    </div>
  </form>
</div>
